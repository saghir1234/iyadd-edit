<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Cairo;src:url(../styles/fonts/Cairo.ttf);font-weight:200 1000}
@font-face{font-family:Comfortaa;src:url(../styles/fonts/Comfortaa.ttf);font-weight:300 700}
:root{--brand:linear-gradient(100deg,#3fe0f0 0%,#aeffff 16%,#3fe0f0 30%,#b07be0 52%,#d47ee5 68%,#f8b8f9 82%,#3fe0f0 100%);
  --mag:linear-gradient(100deg,#d47ee5 0%,#f8b8f9 35%,#d47ee5 60%,#9854c1 100%)}
html,body{margin:0;width:720px;height:1280px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.w{display:inline-block;white-space:pre}
.grad{background:var(--brand);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.mag{background:var(--mag);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#vig{inset:0;z-index:5;background:radial-gradient(ellipse 80% 62% at 50% 38%,rgba(0,0,0,0) 52%,rgba(11,14,20,.55) 85%,rgba(5,7,11,.8) 100%)}
#glowL{inset:0;z-index:4;mix-blend-mode:screen;background:radial-gradient(ellipse 35% 45% at 0% 45%,rgba(120,73,184,.45),rgba(120,73,184,0) 70%)}
#ident{z-index:6;display:flex;flex-direction:column;align-items:flex-start}
#ident .n{font-family:Cairo;font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 8px #000}
#ident .s{font-family:Comfortaa;font-weight:700;font-size:16px;color:#3fe0f0;text-shadow:0 2px 8px #000}
.cut{inset:0;overflow:hidden;z-index:10;background:radial-gradient(ellipse 85% 65% at 50% 45%,#1d2236 0%,#0b0e14 62%,#05070b 100%)}
.ovl{inset:0;overflow:hidden;z-index:8}
.kw{font-family:Cairo;font-weight:900;line-height:1.25;text-align:center}
#outro{inset:0;z-index:20;display:none}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const W=720,H=1280;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const el=(tag,cls,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);(parent||stage).appendChild(e);return e};
const stage=document.getElementById('stage');
const svg=(inner)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${inner}</svg>`;
const AR=s=>String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let S,items=[];

/* keyword text: white -> brand gradient colour sweep after it lands */
function kw(parent,o){
  const d=el('div','abs kw',parent,{left:(o.x??0)+'px',top:o.y+'px',width:(o.w||W)+'px',fontSize:(o.size||64)+'px',
    fontFamily:o.font=='latin'?'Comfortaa':'Cairo',fontWeight:o.font=='latin'?700:900});
  const base=el('span','w',d,{color:o.color=='white'?'#fff':'#fff',textShadow:'0 3px 14px rgba(0,0,0,.8)'});base.textContent=o.text;
  const top=el('span','abs w '+(o.color=='mag'?'mag':'grad'),d,{left:0,right:0,top:0,textAlign:'center'});top.textContent=o.text;
  return {...o,d,base,top};
}
function kwAnim(o,t,t0){
  const lt=t-(t0+o.at);
  if(o.typing){const n=Math.floor(clamp(lt/(o.typing))*o.text.length);o.base.textContent=o.text.slice(0,n);o.top.textContent=o.text.slice(0,n);}
  const p=ease(lt/.32);o.d.style.opacity=lt>0?p:0;o.d.style.filter=`blur(${(1-p)*9}px)`;
  o.d.style.transform=`translateY(${(1-p)*16}px) scale(${o.pop?(.8+.2*back(lt/.4)):1})`;
  if(o.color=='white'){o.top.style.opacity=0;return}
  const sw=clamp((lt-.15)/.45);           // colour sweep right->left (RTL reading direction)
  o.top.style.clipPath=`inset(0 0 0 ${(1-sw)*100}%)`;
  o.top.style.backgroundPosition=`${(t*22)%260}% 0`;
  o.top.style.filter=`drop-shadow(0 0 12px rgba(${o.color=='mag'?'212,126,229':'63,224,240'},.55))`;
}

/* war-room background: grid + radar rings + violet glow */
function warroom(root){
  const g=el('div','abs',root,{inset:'-60px'});
  let s='';for(let x=0;x<=W+120;x+=60)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H+120}" stroke="#3fe0f0" stroke-opacity=".07"/>`;
  for(let y=0;y<=H+120;y+=60)s+=`<line x1="0" y1="${y}" x2="${W+120}" y2="${y}" stroke="#3fe0f0" stroke-opacity=".07"/>`;
  g.innerHTML=`<svg width="${W+120}" height="${H+120}">${s}</svg>`;
  const glow=el('div','abs',root,{left:'-100px',top:'300px',width:'920px',height:'800px',borderRadius:'50%',filter:'blur(70px)',background:'radial-gradient(circle,rgba(120,73,184,.38),rgba(120,73,184,0) 65%)'});
  const rings=el('div','abs',root,{inset:'0'});
  return {g,glow,rings};
}
const ringsAt=(cx,cy,lt)=>{let s='';for(let i=0;i<4;i++){const r=((lt*60+i*90)%360)+40;s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#3fe0f0" stroke-opacity="${.22*(1-r/400)}" stroke-width="2"/>`}return s};

/* glowing white figure (walk cycle) */
function fig(x,y,h,ph,op=1,dash=false){
  const rad=d=>d*Math.PI/180,lw=h*.085,sw=Math.sin(ph);
  const hip=[x,y-h*.47],neck=[x+h*.03,y-h*.79],head=[x+h*.05,y-h*.9];
  const limb=(p,a,l)=>[p[0]+Math.sin(rad(a))*l,p[1]+Math.cos(rad(a))*l];
  const k1=limb(hip,28*sw,h*.24),k2=limb(hip,-28*sw,h*.24),f1=limb(k1,28*sw-(sw>0?0:25),h*.24),f2=limb(k2,-28*sw-(sw<0?0:25),h*.24);
  const sh=[neck[0],neck[1]+h*.03],e1=limb(sh,-30*sw,h*.18),e2=limb(sh,30*sw,h*.18),w1=limb(e1,-30*sw-20,h*.17),w2=limb(e2,30*sw-20,h*.17);
  const c=dash?'#3fe0f0':'#fff',da=dash?`stroke-dasharray="6 8"`:'';
  const l=(a,b,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${da}/>`;
  return `<g opacity="${op}" style="filter:drop-shadow(0 0 8px rgba(63,224,240,.8))">${l(hip,k1,lw)}${l(k1,f1,lw)}${l(hip,k2,lw)}${l(k2,f2,lw)}${l(hip,neck,h*.13)}${l(sh,e1,lw*.8)}${l(e1,w1,lw*.8)}${l(sh,e2,lw*.8)}${l(e2,w2,lw*.8)}${dash?`<circle cx="${head[0]}" cy="${head[1]}" r="${h*.085}" fill="none" stroke="${c}" stroke-width="3" ${da}/>`:`<circle cx="${head[0]}" cy="${head[1]}" r="${h*.085}" fill="${c}"/>`}</g>`;
}
function hand(x,y,s,hl){ // simple open hand icon
  const c=hl?'#d47ee5':'#e6ecf5',st=hl?'#f8b8f9':'#3fe0f0';
  const f=[[-.34,-.62,.15,.55],[-.13,-.78,.15,.72],[.08,-.74,.15,.68],[.28,-.6,.14,.52]];
  let p=`<rect x="${x-.4*s}" y="${y-.25*s}" width="${.8*s}" height="${.7*s}" rx="${.22*s}" fill="${c}"/>`;
  f.forEach(([dx,dy,w,hh])=>p+=`<rect x="${x+dx*s-w*s/2+.07*s}" y="${y+dy*s}" width="${w*s}" height="${hh*s}" rx="${w*s/2}" fill="${c}"/>`);
  p+=`<rect x="${x-.62*s}" y="${y-.05*s}" width="${.14*s}" height="${.42*s}" rx="${.07*s}" fill="${c}" transform="rotate(-35 ${x-.55*s} ${y+.15*s})"/>`;
  return `<g style="filter:drop-shadow(0 0 ${hl?14:5}px ${st})">${p}</g>`;
}

function buildScene(c){
  const root=el('div','abs cut',stage);const o={...c,kind:'scene',root,wr:warroom(root)};
  o.fg=el('div','abs',root,{inset:'0'});
  o.txt=(c.texts||[]).map(x=>kw(root,x));
  if(c.depth)o.depth=el('div','abs kw',root,{left:'0',width:W+'px',top:(c.depth.y)+'px',fontSize:(c.depth.size||70)+'px',color:'#9854c1',opacity:0,filter:'blur(6px)'}),o.depth.textContent=c.depth.text;
  if(c.type=='outro'){root.style.background='rgba(5,7,11,.72)'; o.wr.g.style.display='none'; o.wr.glow.style.opacity=.5}
  return o;
}
function sceneRender(it,t){
  const lt=t-it.t0,end=it.t1>=S.duration-0.05;
  let a=end?ease(lt/.15):Math.min(ease(lt/.15),1-ease((t-(it.t1-.12))/.12));
  let ty=0;
  if(it.slideIn){ty=(1-ease((lt+.35)/.35))*H}             // vertical slide-up entrance, in step with the previous scene's exit
  if(it.slideOut&&!end){ty-=ease((t-(it.t1-.35))/.35)*H;a=Math.max(a,1)}
  it.root.style.opacity=it.slideIn||it.slideOut?1:a;it.root.style.transform=`translateY(${ty}px)`;
  it.wr.g.style.transform=`translate(${-lt*6}px,${-lt*4}px)`;it.wr.glow.style.transform=`translateX(${Math.sin(lt*.8)*40}px)`;
  const zoom=1+lt*.012;it.fg.style.transform=`scale(${zoom})`;it.fg.style.transformOrigin='50% 55%';
  const T=it.type;let g='';
  if(T=='walk'){const x=-60+lt*170;g=ringsAt(360,820,lt)+`<line x1="0" y1="900" x2="720" y2="900" stroke="#3fe0f0" stroke-opacity=".35" stroke-width="2"/>`+fig(x,900,260,lt*7);
    if(it.ghostAt!=null&&lt>it.ghostAt){const q=ease((lt-it.ghostAt)/.5);g+=fig(x+230,900,260,lt*7+Math.PI,q*.9,true)+`<text x="${x+250}" y="590" font-family="Cairo" font-weight="900" font-size="110" fill="#d47ee5" opacity="${q}" style="filter:drop-shadow(0 0 14px #d47ee5)">؟</text>`}}
  if(T=='face'){const blur=it.blurAt!=null?clamp((lt-it.blurAt)/.6)*7:0;
    g=ringsAt(360,640,lt)+`<g style="filter:drop-shadow(0 0 12px rgba(63,224,240,.7))"><ellipse cx="360" cy="620" rx="170" ry="225" fill="none" stroke="#3fe0f0" stroke-width="5"/>
      <g style="filter:blur(${blur}px)"><path d="M285,590 q25,14 50,0 M385,590 q25,14 50,0" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M360,620 l-14,60 h26" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M315,740 q45,24 90,0" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></g></g>`;
    if(it.qAt!=null&&lt>it.qAt){const q=back((lt-it.qAt)/.45);g+=`<text x="360" y="700" text-anchor="middle" font-family="Cairo" font-weight="900" font-size="${200*q}" fill="#d47ee5" opacity=".9" style="filter:drop-shadow(0 0 18px #d47ee5)">؟</text>`}}
  if(T=='hands'){const cols=4,rows=3,sx=150,sy=190,x0=135,y0=470;const sh=it.shuffleAt!=null&&lt>it.shuffleAt&&lt<it.shuffleAt+1.4;
    for(let i=0;i<12;i++){let cx=x0+(i%cols)*sx,cy=y0+Math.floor(i/cols)*sy;if(sh){const k=Math.sin((lt-it.shuffleAt)*9+i*1.7)*28;cx+=k;cy+=Math.cos((lt-it.shuffleAt)*8+i)*18}
      const app=clamp((lt-.1-i*.05)/.3);g+=`<g opacity="${app}" transform="translate(${cx} ${cy}) scale(${.6+.4*ease(app)}) translate(${-cx} ${-cy})">${hand(cx,cy,100,it.hlAt!=null&&lt>it.hlAt&&i==6)}</g>`}
    if(it.hlAt!=null&&lt>it.hlAt){const q=ease((lt-it.hlAt)/.3);g+=`<path d="M${x0+2*sx} ${y0+sy-150} l-16,-26 h32 z" fill="#d47ee5" opacity="${q}" style="filter:drop-shadow(0 0 10px #3fe0f0)"/>`}}
  if(T=='counter'){const p=it.countAt!=null?clamp((lt-it.countAt)/(it.countDur||1.2)):1;const v=Math.round((it.from||0)+((it.to||0)-(it.from||0))*(1-Math.pow(1-p,3)));
    it.num=it.num||el('div','abs kw mag',it.root,{left:0,width:W+'px',top:(it.numTop||470)+'px',fontSize:(it.numSize||220)+'px',direction:'ltr'});
    it.num.textContent=AR(v)+(it.suffix||'');it.num.style.opacity=clamp(lt/.25);it.num.style.filter='drop-shadow(0 0 20px rgba(212,126,229,.6))';it.num.style.backgroundPosition=`${(t*22)%260}% 0`;
    g=ringsAt(360,(it.numTop||470)+120,lt)}
  if(T=='voice'){g=ringsAt(360,640,lt);const n=34;
    for(let i=0;i<n;i++){const x=110+i*15,h=(Math.abs(Math.sin(lt*7+i*.9))*.7+.3)*(90+80*Math.sin(i*.4))*clamp(lt/.4);
      g+=`<rect x="${x}" y="${640-h/2}" width="8" height="${h}" rx="4" fill="url(#vg)"/>`}
    g=`<defs><linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="#3fe0f0"/><stop offset=".5" stop-color="#9854c1"/><stop offset="1" stop-color="#d47ee5"/></linearGradient></defs>`+g+
      `<g transform="translate(360 470)" style="filter:drop-shadow(0 0 10px #3fe0f0)"><rect x="-26" y="-60" width="52" height="88" rx="26" fill="none" stroke="#fff" stroke-width="6"/><path d="M-44,8 a44,44 0 0,0 88,0 M0,52 v24 M-26,76 h52" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/></g>`}
  if(T=='title'){g=ringsAt(360,700,lt)}
  if(T=='outro'){const r=back((lt-.1)/.45),fill=clamp((lt-.45)/.5);
    g=`<defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fe0f0"/><stop offset=".5" stop-color="#9854c1"/><stop offset="1" stop-color="#d47ee5"/></linearGradient></defs>
      <g transform="translate(360 560) scale(${r}) rotate(${lt*40})"><circle r="140" fill="none" stroke="${fill>0?'url(#og)':'#fff'}" stroke-width="18" style="filter:drop-shadow(0 0 16px rgba(63,224,240,.7))"/><circle r="140" fill="none" stroke="#fff" stroke-width="18" opacity="${1-fill}"/></g>`;
    it.handle=it.handle||el('div','abs',it.root,{left:0,width:W+'px',top:'760px',textAlign:'center',fontFamily:'Comfortaa',fontWeight:700,fontSize:'40px',color:'#fff',direction:'ltr',textShadow:'0 0 14px rgba(63,224,240,.6)'});
    const hs='@edureel.studio';it.handle.textContent=hs.slice(0,Math.ceil(clamp((lt-.45)/.6)*hs.length));
    it.brand=it.brand||el('div','abs grad',it.root,{left:0,width:W+'px',top:'528px',textAlign:'center',fontFamily:'Comfortaa',fontWeight:700,fontSize:'44px',direction:'ltr'});
    it.brand.textContent='EduReel';it.brand.style.opacity=fill;it.brand.style.backgroundPosition=`${(t*22)%260}% 0`}
  it.fg.innerHTML=svg(g);
  if(it.depth){const q=clamp((lt-it.depth.at)/.4);it.depth.style.opacity=q*.6}
  it.txt.forEach(x=>kwAnim(x,t,it.t0));
}

function init(spec){
  S=spec;el('div','abs',stage).id='vig';el('div','abs',stage).id='glowL';
  const id=el('div','abs',stage,{left:'36px',top:'1120px'});id.id='ident';
  el('div','n',id).textContent=S.identity.name;el('div','s',id).textContent=S.identity.source;items.push({kind:'ident',t0:S.identity.from||0,t1:S.identity.until||4,e:id});
  (S.overlays||[]).forEach(c=>{const root=el('div','abs ovl',stage);items.push({...c,kind:'ovl',root,txt:c.texts.map(x=>kw(root,x))})});
  (S.scenes||[]).forEach(c=>items.push(buildScene(c)));
}
function render(t){
  items.forEach(it=>{
    if(it.kind=='ident'){const p=ease((t-it.t0-.3)/.5)*(1-ease((t-it.t1)/.5));it.e.style.opacity=p;return}
    if(it.kind=='ovl'){const on=t>=it.t0-.05&&t<it.t1+.3;it.root.style.display=on?'block':'none';if(!on)return;
      it.root.style.opacity=1-ease((t-it.t1)/.25);it.txt.forEach(x=>kwAnim(x,t,0));return}
    if(it.kind=='scene'){const on=t>=it.t0-(it.slideIn?.35:0)&&t<it.t1;it.root.style.display=on?'block':'none';if(on)sceneRender(it,t)}
  });
}
window.init=init;window.render=render;
</script>
</body>
</html>
