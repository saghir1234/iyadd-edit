<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Amiri;src:url(fonts/Amiri-Bold.ttf);font-weight:700}
@font-face{font-family:Ruqaa;src:url(fonts/ArefRuqaa-Bold.ttf);font-weight:700}
@font-face{font-family:Cairo;src:url(fonts/Cairo.ttf);font-weight:200 1000}
:root{--brand:linear-gradient(100deg,#3fe0f0 0%,#aeffff 18%,#3fe0f0 34%,#b07be0 54%,#d47ee5 70%,#f8b8f9 84%,#3fe0f0 100%)}
html,body{margin:0;width:720px;height:1280px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.w{display:inline-block;white-space:pre}
.grad{background:var(--brand);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
#vig{inset:0;z-index:5;background:radial-gradient(ellipse 80% 65% at 50% 40%,rgba(0,0,0,0) 55%,rgba(11,14,20,.6) 100%)}
#cap{z-index:30;left:24px;right:24px;top:1040px;height:120px;display:flex;align-items:center;justify-content:center;text-align:center}
#cap .line{font-family:Cairo;font-weight:800;font-size:44px;color:#fff;white-space:nowrap;
  -webkit-text-stroke:5px rgba(0,0,0,.85);paint-order:stroke fill;text-shadow:0 4px 14px rgba(0,0,0,.7)}
#ident{z-index:6;display:flex;flex-direction:column;align-items:flex-start}
#ident .n{font-family:Cairo;font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 8px #000}
#ident .s{font-family:Cairo;font-weight:600;font-size:16px;color:#3fe0f0;text-shadow:0 2px 8px #000}
.cut{inset:0;overflow:hidden;z-index:10;background:linear-gradient(180deg,#0b0e14 0%,#161a26 30%,#3a2470 70%,#7849b8 88%,#d47ee5 100%)}
.ovl{inset:0;overflow:hidden;z-index:8}
.card{border-radius:26px;overflow:hidden;background-size:cover;background-position:center;
  box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 0 1.5px rgba(63,224,240,.5),0 0 28px rgba(63,224,240,.18)}
.card .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:16px;font-family:Cairo;font-weight:900;font-size:50px;color:#fff;
  text-shadow:0 3px 14px rgba(0,0,0,.9);background:linear-gradient(90deg,rgba(11,14,20,.15),rgba(11,14,20,.55))}
.card .num{font-size:30px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#3fe0f0,#9854c1,#d47ee5);box-shadow:0 0 16px rgba(63,224,240,.7);text-shadow:none}
#flare{inset:-100px;z-index:25;pointer-events:none;mix-blend-mode:screen;opacity:0}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const W=720,H=1280;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c1=1.5,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const el=(tag,cls,parent,style)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(style)Object.assign(e.style,style);(parent||stage).appendChild(e);return e};
const stage=document.getElementById('stage');
let S,items=[],flare,flares=[];
const svg=(inner)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${inner}</svg>`;

/* text: soft = calligraphy white (slanted), key = Cairo Black brand gradient with bloom, small = Cairo regular grey */
function txt(parent,o){
  const d=el('div','abs',parent,{left:(o.x??0)+'px',top:o.y+'px',width:(o.w||W)+'px',textAlign:o.align||'center'});
  const k=o.kind||'key';
  const s=el('span','w'+(k=='key'?' grad':''),d,{
    fontFamily:k=='soft'?'Ruqaa':'Cairo',fontWeight:k=='soft'?700:k=='key'?900:500,
    fontSize:(o.size||(k=='key'?78:k=='soft'?54:28))+'px',lineHeight:1.3,
    color:k=='small'?'#d9dbe3':k=='soft'?'#fff':undefined,
    transform:k=='soft'?'skewX(-8deg)':'',
    textShadow:k=='key'?'':'0 3px 12px rgba(0,0,0,.75)'});
  s.textContent=o.text;return {...o,kind:k,d,s};
}
function txtAnim(o,t,base){
  const lt=t-(base+o.at);
  if(o.kind=='key'){const p=back(lt/.45),b=Math.max(0,1-lt/.6);
    o.s.style.opacity=lt>0?clamp(lt/.12):0;o.s.style.transform=`scale(${.6+.4*p})`;
    o.s.style.filter=`drop-shadow(0 0 ${8+b*26}px rgba(63,224,240,${.55+b*.35})) drop-shadow(0 0 30px rgba(212,126,229,.35)) drop-shadow(0 4px 8px rgba(0,0,0,.6))`;
    o.s.style.backgroundPosition=`${(t*24)%260}% 0`;return}
  const p=ease(lt/.55);o.s.style.opacity=p;o.s.style.filter=`blur(${(1-p)*8}px)`;
  o.s.style.transform=(o.kind=='soft'?'skewX(-8deg) ':'')+`translateY(${(1-p)*14}px)`;
}

/* glossy cube (isometric) */
function cube(cx,cy,s){
  const top=`${cx},${cy-s*.5} ${cx+s*.87},${cy} ${cx},${cy+s*.5} ${cx-s*.87},${cy}`;
  const left=`${cx-s*.87},${cy} ${cx},${cy+s*.5} ${cx},${cy+s*1.5} ${cx-s*.87},${cy+s}`;
  const right=`${cx+s*.87},${cy} ${cx},${cy+s*.5} ${cx},${cy+s*1.5} ${cx+s*.87},${cy+s}`;
  return `<defs><linearGradient id="ct" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2b3fc"/><stop offset="1" stop-color="#9854c1"/></linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7849b8"/><stop offset="1" stop-color="#2b1850"/></linearGradient>
    <linearGradient id="cr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe0f0"/><stop offset="1" stop-color="#1a4f7a"/></linearGradient></defs>
    <ellipse cx="${cx}" cy="${cy+s*1.55}" rx="${s*1.3}" ry="${s*.22}" fill="#000" opacity=".45"/>
    <polygon points="${left}" fill="url(#cl)"/><polygon points="${right}" fill="url(#cr)"/><polygon points="${top}" fill="url(#ct)"/>
    <polyline points="${cx-s*.87},${cy} ${cx},${cy+s*.5} ${cx+s*.87},${cy}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>`;
}
function person(x,y,h,c,pose){ // simple dark silhouette, pose: 'look' (head up) or 'stand'
  const lw=h*.09,hip=[x,y-h*.47],neck=[x,y-h*.8],head=[x+(pose=='look'?h*.03:0),y-h*.92];
  const l=(a,b,w)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  return l(hip,[x-h*.07,y],lw)+l(hip,[x+h*.07,y],lw)+l(hip,neck,h*.15)+l([x,y-h*.76],[x-h*.12,y-h*.5],lw*.8)+
    (pose=='look'?l([x,y-h*.76],[x+h*.16,y-h*.98],lw*.8):l([x,y-h*.76],[x+h*.12,y-h*.5],lw*.8))+`<circle cx="${head[0]}" cy="${head[1]}" r="${h*.085}" fill="${c}"/>`;
}

function buildScene(c){
  const root=el('div','abs cut',stage);const o={...c,kind:'scene',root};
  o.glow=el('div','abs',root,{width:'900px',height:'700px',left:'-90px',top:'780px',borderRadius:'50%',filter:'blur(70px)',
    background:'radial-gradient(circle,rgba(212,126,229,.55),rgba(152,84,193,0) 65%)'});
  if(c.type=='board'){ // pinned note on a dark panel, push-in + focus pull
    o.board=el('div','abs',root,{left:'90px',top:'190px',width:'540px',height:'900px',borderRadius:'8px',
      background:'repeating-linear-gradient(90deg,#1d2236 0px,#232a42 18px,#1a1f31 36px)',boxShadow:'0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(63,224,240,.25)'});
    o.note=el('div','abs',root,{left:'150px',top:'470px',width:'420px',padding:'26px 30px',borderRadius:'6px',background:'linear-gradient(170deg,#ffffff,#e8ebf3)',
      boxShadow:'0 24px 40px rgba(0,0,0,.55)',transform:'rotate(-2deg)',fontFamily:'Cairo',color:'#0b0e14'});
    el('div','abs',o.note,{left:'200px',top:'-14px',width:'22px',height:'22px',borderRadius:'50%',background:'radial-gradient(circle at 35% 35%,#f8b8f9,#9854c1)',boxShadow:'0 6px 10px rgba(0,0,0,.5)'});
    el('div','',o.note,{fontWeight:900,fontSize:'34px',textAlign:'center',marginBottom:'10px'}).textContent=c.title;
    o.rows=c.rows.map(r=>{const row=el('div','',o.note,{display:'flex',alignItems:'center',gap:'14px',fontSize:'30px',fontWeight:800,padding:'8px 0',borderTop:'1.5px solid #d3d7e3'});
      const b=el('span','',row,{width:'34px',height:'34px',borderRadius:'8px',border:'3px solid #9854c1',display:'inline-flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:'24px'});
      el('span','',row).textContent=r.text;return {...r,b,row}});
    o.txt=(c.texts||[]).map(x=>txt(root,x));
  }
  if(c.type=='symbol'){ // glossy extruded glyph rising
    o.sym=el('div','abs',root,{left:'0',right:'0',top:(c.symTop||330)+'px',textAlign:'center',fontFamily:'Cairo',fontWeight:1000,fontSize:(c.symSize||420)+'px',lineHeight:1});
    const sh=[];for(let i=1;i<=22;i++)sh.push(`${i*.6}px ${i}px 0 hsl(${275-i*2},55%,${34-i*.8}%)`);
    sh.push('0 40px 60px rgba(0,0,0,.6)');
    o.symBack=el('span','w',o.sym,{color:'#5c3796',textShadow:sh.join(',')});o.symBack.textContent=c.symbol;
    o.symFace=el('span','abs w grad',o.sym,{left:'0',right:'0',top:'0'});o.symFace.textContent=c.symbol;
    o.shine=el('div','abs',root,{width:'120px',height:'900px',top:'200px',background:'linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0))',transform:'rotate(18deg)',mixBlendMode:'overlay'});
    o.txt=(c.texts||[]).map(x=>txt(root,x));
  }
  if(c.type=='pedestal'){o.fg=el('div','abs',root,{inset:'0'});o.txt=(c.texts||[]).map(x=>txt(root,x))}
  if(c.type=='cards'){
    o.cards=c.cards.map((cd,i)=>{const k=el('div','abs card',root,{left:'70px',width:'580px',height:(c.cardH||170)+'px',top:((c.top||270)+i*((c.cardH||170)+26))+'px',backgroundImage:`url(${cd.img})`});
      const lab=el('div','lab',k);const n=el('span','num',lab);n.textContent=cd.n;el('span','',lab).textContent=cd.label;return {...cd,k}});
    o.txt=(c.texts||[]).map(x=>txt(root,x));
  }
  if(c.type=='loop'){o.fg=el('div','abs',root,{inset:'0'});o.cnt=el('div','abs grad',root,{left:'0',right:'0',top:'560px',textAlign:'center',fontFamily:'Cairo',fontWeight:1000,fontSize:'150px',lineHeight:1});
    o.txt=(c.texts||[]).map(x=>txt(root,x))}
  if(c.trans!='none')flares.push(c.t0);
  return o;
}
function buildPair(c){const root=el('div','abs ovl',stage);
  el('div','abs',root,{inset:'0',background:`radial-gradient(ellipse 70% 30% at 50% ${(c.y0||640)/12.8}%,rgba(11,14,20,.55),rgba(11,14,20,0) 70%)`});
  return {...c,kind:'pair',root,txt:c.texts.map(x=>txt(root,x))}}

function init(spec){
  S=spec;el('div','abs',stage).id='vig';
  const id=el('div','abs',stage,{left:'36px',top:'960px'});id.id='ident';
  el('div','n',id).textContent=S.identity.name;el('div','s',id).textContent=S.identity.source;items.push({kind:'ident',t1:S.identity.until||4,e:id});
  const cap=el('div','abs',stage);cap.id='cap';
  S.phrases.forEach(ph=>{const line=el('div','line abs',cap,{left:'0',right:'0',textAlign:'center'});
    const ws=ph.words.map((w,i)=>{const s=el('span','w',line);s.textContent=w.w+(i<ph.words.length-1?' ':'');return s});
    items.push({kind:'cap',t0:ph.t0,t1:ph.t1,line,ws,words:ph.words})});
  (S.overlays||[]).forEach(c=>items.push(buildPair(c)));
  (S.scenes||[]).forEach(c=>items.push(buildScene(c)));
  flare=el('div','abs',stage);flare.id='flare';
}
function sceneRender(it,t){
  const lt=t-it.t0,dur=it.t1-it.t0,end=it.t1>=S.duration-0.05;
  it.root.style.opacity=end?ease(lt/.18):Math.min(ease(lt/.18),1-ease((t-(it.t1-.2))/.2));
  it.glow.style.transform=`translateX(${Math.sin(lt*.8)*40}px)`;
  if(it.type=='board'){const f=ease(lt/.8);it.board.style.transform=`scale(${1.08+lt*.02})`;it.board.style.filter=`blur(${(1-f)*6}px)`;
    it.note.style.filter=`blur(${(1-f)*9}px)`;it.note.style.transform=`rotate(-2deg) scale(${.94+lt*.02+.06*f})`;
    it.rows.forEach(r=>{const p=clamp((t-it.t0-r.at)/.25);r.b.style.background=p>0?'linear-gradient(135deg,#3fe0f0,#9854c1)':'transparent';r.b.textContent=p>0?'✓':'';
      r.row.style.color=p>0?'#0b0e14':'#8a90a3';r.b.style.transform=`scale(${p>0?1+.3*Math.max(0,1-(t-it.t0-r.at)/.3):1})`})}
  if(it.type=='symbol'){const p=back((lt-.05)/.7);it.sym.style.transform=`translateY(${(1-p)*260}px) rotateY(${(1-p)*30}deg)`;it.sym.style.opacity=clamp(lt/.25);
    it.symFace.style.backgroundPosition=`${(t*24)%260}% 0`;it.shine.style.left=(-200+((lt*420)%1200))+'px'}
  if(it.type=='pedestal'){const r=back(lt/.7);
    it.fg.innerHTML=svg(`<g transform="translate(0 ${(1-r)*300})">${cube(360,760,190)}${person(360,700,190,'#0b0e14','look')}</g>
      <g opacity="${clamp((lt-.5)/.4)}">${[0,1,2,3,4,5].map(i=>`<circle cx="${180+i*72}" cy="${180+((i*53+lt*30)%260)}" r="${2+i%3}" fill="#aeffff" opacity=".8"/>`).join('')}</g>`)}
  if(it.type=='cards')it.cards.forEach((cd,i)=>{const p=back((t-it.t0-cd.at)/.5);cd.k.style.transform=`translateX(${(1-p)*-700}px)`;cd.k.style.opacity=t-it.t0-cd.at>0?1:0;
    const act=it.active!=null&&t>=it.t0+it.active[i]&&(i+1>=it.active.length||t<it.t0+it.active[i+1]);cd.k.style.boxShadow=act?'0 22px 50px rgba(0,0,0,.55),0 0 0 2.5px #3fe0f0,0 0 40px rgba(63,224,240,.55)':''});
  if(it.type=='loop'){const rot=lt*200;let n=0;(it.counts||[]).forEach(c=>{if(lt>=c.at)n=c.v});it.cnt.textContent=String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);it.cnt.style.backgroundPosition=`${(t*24)%260}% 0`;
    it.cnt.style.filter='drop-shadow(0 0 18px rgba(63,224,240,.6))';
    it.fg.innerHTML=svg(`<defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3fe0f0"/><stop offset=".5" stop-color="#9854c1"/><stop offset="1" stop-color="#d47ee5"/></linearGradient></defs>
      <g transform="rotate(${rot} 360 640)" style="filter:drop-shadow(0 0 12px rgba(63,224,240,.6))">
      <path d="M360,420 A220,220 0 1,1 150,580" fill="none" stroke="url(#lg)" stroke-width="26" stroke-linecap="round"/>
      <polygon points="120,560 190,560 150,620" fill="#d47ee5" transform="rotate(-25 150 580)"/></g>`)}
  it.txt.forEach(x=>txtAnim(x,t,it.t0));
}
function busyAt(t){return items.some(it=>(it.kind=='scene'&&t>=it.t0-0.05&&t<it.t1+0.05)||((it.kind=='words'||it.kind=='pair')&&t>=it.t0-0.05&&t<it.t1+0.35))}
function render(t){
  const busy=busyAt(t);document.getElementById('cap').style.opacity=busy?0:1;
  items.forEach(it=>{
    if(it.kind=='ident'){const p=ease((t-.4)/.6)*(1-ease((t-it.t1)/.5));it.e.style.opacity=p;return}
    if(it.kind=='cap'){const on=t>=it.t0&&t<it.t1;it.line.style.display=on?'block':'none';if(!on)return;
      it.ws.forEach((s,i)=>{const w=it.words[i];const p=ease((t-w.s+0.02)/.12);s.style.opacity=t>=w.s-0.02?p:0;
        const nx=i+1<it.words.length?it.words[i+1].s:it.t1;const act=t>=w.s-0.02&&t<nx-0.02;s.style.color=act?'#3fe0f0':'#fff';
        s.style.textShadow=act?'0 0 10px rgba(63,224,240,.8),0 4px 14px rgba(0,0,0,.7)':''});return}
    if(it.kind=='pair'){const on=t>=it.t0-.05&&t<it.t1+.4;it.root.style.display=on?'block':'none';if(!on)return;
      it.root.style.opacity=1-ease((t-it.t1)/.35);it.txt.forEach(x=>txtAnim(x,t,0));return}
    if(it.kind=='scene'){const on=t>=it.t0&&t<it.t1;it.root.style.display=on?'block':'none';if(on)sceneRender(it,t)}
  });
  let F=0,ft=0;flares.forEach(t0=>{const d=t-t0+.15;if(d>0&&d<.6){const v=Math.sin(Math.PI*d/.6);if(v>F){F=v;ft=d}}});
  flare.style.opacity=F;
  flare.style.background=`radial-gradient(circle at ${30+ft*90}% 45%,rgba(255,255,255,.95) 0%,rgba(174,255,255,.8) 6%,rgba(63,224,240,.45) 18%,rgba(63,224,240,0) 40%),
    radial-gradient(ellipse 120% 8% at 50% 45%,rgba(212,126,229,.75),rgba(212,126,229,0) 60%),
    radial-gradient(circle at 70% 60%,rgba(248,184,249,.5),rgba(248,184,249,0) 30%)`;
}
window.init=init;window.render=render;
</script>
</body>
</html>
